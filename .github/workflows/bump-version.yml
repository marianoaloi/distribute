name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit and push branch
        env:
          BRANCH: bump-version-${{ github.run_number }}
        run: |
          git checkout -b "$BRANCH"
          git commit -am "Bump version to ${{ steps.bump.outputs.version }}"
          git push origin HEAD

      - name: Open PR and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bump-version-${{ github.run_number }}
        run: |
          gh pr create \
            --title "Bump version to ${{ steps.bump.outputs.version }}" \
            --body "Automated version bump to ${{ steps.bump.outputs.version }}." \
            --base master \
            --head "$BRANCH"
          gh pr merge --auto --squash "$BRANCH"
